history:
  - text: "Miranda was inspired by Ron Chernow's biography of Alexander Hamilton. He set the Founding Fathers' story to hip-hop, R&B and pop numbers alongside classic show tunes, casting performers of colour as the historical figures."
    source: https://en.wikipedia.org/wiki/Hamilton_(musical)
  - text: "It opened Off-Broadway at the Public Theater in early 2015 and moved to Broadway's Richard Rodgers Theatre that August. A West End production followed at the Victoria Palace Theatre in late 2017, and touring companies have since played in many cities."
    source: https://en.wikipedia.org/wiki/Hamilton_(musical)
  - text: "The show won the Pulitzer Prize for Drama and the Tony Award for Best Musical in 2016."
    source: https://en.wikipedia.org/wiki/Hamilton_(musical)
