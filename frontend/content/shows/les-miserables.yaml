history:
  - text: "The musical adapts Victor Hugo's 1862 novel of the same name. It began as a French-language concept recording and stage show in Paris in 1980, before producer Cameron Mackintosh commissioned an English-language version."
    source: https://en.wikipedia.org/wiki/Les_Misérables_(musical)
  - text: "The English production, co-produced with the Royal Shakespeare Company, opened at the Barbican in London in October 1985 and soon transferred to the Palace Theatre in the West End. It reached Broadway in March 1987 and has since toured widely and been staged around the world."
    source: https://en.wikipedia.org/wiki/Les_Misérables_(musical)
  - text: "The Broadway production won the Tony Award for Best Musical in 1987."
    source: https://en.wikipedia.org/wiki/Les_Misérables_(musical)
