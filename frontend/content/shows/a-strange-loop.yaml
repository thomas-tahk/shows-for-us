history:
  - text: "Michael R. Jackson's musical follows Usher, a Black, queer writer working as an usher at a Broadway theatre while trying to write a musical about a Black, queer writer working as an usher."
    source: https://en.wikipedia.org/wiki/A_Strange_Loop
  - text: "It premiered Off-Broadway at Playwrights Horizons in 2019 and opened on Broadway at the Lyceum Theatre in April 2022."
    source: https://en.wikipedia.org/wiki/A_Strange_Loop
  - text: "It won the Pulitzer Prize for Drama in 2020 and the Tony Award for Best Musical in 2022."
    source: https://en.wikipedia.org/wiki/A_Strange_Loop
