history:
  - text: "The musical is based on Gaston Leroux's 1910 novel about a disfigured musical genius who haunts the Paris Opera House and becomes obsessed with a young soprano, Christine. Andrew Lloyd Webber composed the score."
    source: https://en.wikipedia.org/wiki/The_Phantom_of_the_Opera_(1986_musical)
  - text: "It opened in the West End at Her Majesty's Theatre in October 1986 and on Broadway at the Majestic Theatre in January 1988. The Broadway production became the longest-running show in that city's history before closing in April 2023."
    source: https://en.wikipedia.org/wiki/The_Phantom_of_the_Opera_(1986_musical)
  - text: "The Broadway production won the Tony Award for Best Musical in 1988."
    source: https://en.wikipedia.org/wiki/The_Phantom_of_the_Opera_(1986_musical)
