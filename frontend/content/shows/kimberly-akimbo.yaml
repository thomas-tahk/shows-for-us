history:
  - text: "The musical is adapted from David Lindsay-Abaire's own 2000 play about a teenager with a rare condition that makes her age at several times the normal speed. Lindsay-Abaire wrote the book and lyrics, and Jeanine Tesori composed the score."
    source: https://en.wikipedia.org/wiki/Kimberly_Akimbo_(musical)
  - text: "It was developed at the Atlantic Theater Company Off-Broadway before opening on Broadway at the Booth Theatre in November 2022. A national tour followed."
    source: https://en.wikipedia.org/wiki/Kimberly_Akimbo_(musical)
  - text: "It won the Tony Award for Best Musical in 2023."
    source: https://en.wikipedia.org/wiki/Kimberly_Akimbo_(musical)
