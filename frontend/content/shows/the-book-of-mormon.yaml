history:
  - text: "The satirical musical follows two young missionaries sent to Uganda. It was created by South Park co-creators Trey Parker and Matt Stone together with Robert Lopez, co-composer of Avenue Q, and directed by Parker and Casey Nicholaw."
    source: https://en.wikipedia.org/wiki/The_Book_of_Mormon_(musical)
  - text: "It opened on Broadway at the Eugene O'Neill Theatre in March 2011. A West End production opened at the Prince of Wales Theatre in 2013, and North American tours followed."
    source: https://en.wikipedia.org/wiki/The_Book_of_Mormon_(musical)
  - text: "The show won nine Tony Awards, including Best Musical, in 2011."
    source: https://en.wikipedia.org/wiki/The_Book_of_Mormon_(musical)
