history:
  - text: "The musical is based on the 2005 British film of the same name, about a struggling shoe factory that turns to making boots for drag performers. Cyndi Lauper wrote the score, her first for the stage, and Harvey Fierstein the book."
    source: https://en.wikipedia.org/wiki/Kinky_Boots_(musical)
  - text: "After a tryout in Chicago in late 2012, it opened on Broadway at the Al Hirschfeld Theatre in April 2013. A West End production opened at the Adelphi Theatre in 2015."
    source: https://en.wikipedia.org/wiki/Kinky_Boots_(musical)
  - text: "It won the Tony Award for Best Musical in 2013."
    source: https://en.wikipedia.org/wiki/Kinky_Boots_(musical)
