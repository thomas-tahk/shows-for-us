history:
  - text: "The rock musical centres on a suburban mother living with bipolar disorder and the effect of her illness and treatment on her family. Tom Kitt wrote the music and Brian Yorkey the book and lyrics."
    source: https://en.wikipedia.org/wiki/Next_to_Normal
  - text: "It played Off-Broadway at Second Stage Theatre in 2008 and opened on Broadway at the Booth Theatre in April 2009."
    source: https://en.wikipedia.org/wiki/Next_to_Normal
  - text: "It won the Pulitzer Prize for Drama in 2010, one of few musicals to do so, as well as Tony Awards for its score and its lead actress."
    source: https://en.wikipedia.org/wiki/Next_to_Normal
