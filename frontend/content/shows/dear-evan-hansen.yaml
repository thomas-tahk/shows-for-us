history:
  - text: "The musical follows a socially anxious high school student whose private letter to himself is mistaken for a note by a classmate who has died. Steven Levenson wrote the book, and Benj Pasek and Justin Paul wrote the songs."
    source: https://en.wikipedia.org/wiki/Dear_Evan_Hansen
  - text: "It premiered at Arena Stage in Washington, D.C., in 2015, played Off-Broadway at Second Stage Theatre in 2016, and opened on Broadway at the Music Box Theatre in December 2016. A West End production followed in 2019."
    source: https://en.wikipedia.org/wiki/Dear_Evan_Hansen
  - text: "It won the Tony Award for Best Musical in 2017."
    source: https://en.wikipedia.org/wiki/Dear_Evan_Hansen
