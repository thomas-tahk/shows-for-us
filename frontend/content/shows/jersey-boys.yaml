history:
  - text: "Jersey Boys is a jukebox musical telling the story of the 1960s pop group the Four Seasons, built around the group's hit songs and framed as four members each narrating a part of the story. It was directed by Des McAnuff."
    source: https://en.wikipedia.org/wiki/Jersey_Boys
  - text: "After a run at La Jolla Playhouse in 2004, it opened on Broadway at the August Wilson Theatre in November 2005. A West End production opened in 2008 at the Prince Edward Theatre, and the show has toured widely."
    source: https://en.wikipedia.org/wiki/Jersey_Boys
  - text: "It won the Tony Award for Best Musical in 2006."
    source: https://en.wikipedia.org/wiki/Jersey_Boys
