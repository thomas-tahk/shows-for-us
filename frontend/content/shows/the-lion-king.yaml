history:
  - text: "The stage show adapts Disney's 1994 animated film. Director Julie Taymor became known for its approach to staging, using elaborate puppetry and masks worn by performers rather than costumes that hide them."
    source: https://en.wikipedia.org/wiki/The_Lion_King_(musical)
  - text: "After a tryout in Minneapolis in 1997, it opened on Broadway at the New Amsterdam Theatre in November 1997. It later moved to the Minskoff Theatre, and a West End production opened at the Lyceum Theatre in 1999. Companies have toured and settled in many countries since."
    source: https://en.wikipedia.org/wiki/The_Lion_King_(musical)
  - text: "It won the Tony Award for Best Musical in 1998."
    source: https://en.wikipedia.org/wiki/The_Lion_King_(musical)
