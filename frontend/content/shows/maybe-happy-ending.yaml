history:
  - text: "Maybe Happy Ending is a chamber musical about two obsolete household robots in a near-future Seoul who form a bond. It was written by Will Aronson and Hue Park and first staged in South Korea before being reworked for English-language audiences."
    source: https://en.wikipedia.org/wiki/Maybe_Happy_Ending
  - text: "It opened on Broadway at the Belasco Theatre in November 2024, directed by Michael Arden."
    source: https://en.wikipedia.org/wiki/Maybe_Happy_Ending
  - text: "It won the Tony Award for Best Musical in 2025."
    source: https://en.wikipedia.org/wiki/Maybe_Happy_Ending
