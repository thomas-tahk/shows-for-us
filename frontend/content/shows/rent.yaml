history:
  - text: "Jonathan Larson's rock musical is loosely based on Puccini's opera La bohème and follows a group of struggling artists in New York's East Village. Larson died early on 25 January 1996, the day of the first Off-Broadway preview, and never saw it performed."
    source: https://en.wikipedia.org/wiki/Rent_(musical)
  - text: "It opened Off-Broadway at New York Theatre Workshop in February 1996 and moved to Broadway's Nederlander Theatre in April 1996. A West End production and national tours followed."
