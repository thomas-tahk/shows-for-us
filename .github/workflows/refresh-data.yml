name: Refresh data

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

# NOTE: the repo setting "Settings > Actions > General > Allow GitHub Actions to
# create and approve pull requests" must be ON, or the PR step fails.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Writes frontend/data/shows.json; exits 1 if any show fails.
      - run: npm run pull
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          base: ${{ github.event.repository.default_branch }}
          add-paths: frontend/data/
          commit-message: 'chore: refresh Wikidata/Wikipedia data'
          title: 'chore: weekly data refresh'
          body: Automated weekly refresh of `frontend/data/` from Wikidata and Wikipedia.
          delete-branch: true
